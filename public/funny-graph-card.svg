<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#FFF9E6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="yellowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#FFF3C4"/>
    </linearGradient>
    <pattern id="funnyGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-opacity="0.7"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1A1A1A"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#yellowBg)"/>
  <rect width="1280" height="640" fill="url(#funnyGrid)"/>

  <!-- 40pt Template Border Guidelines (Comedic Red Lines) -->
  <line x1="50" y1="0" x2="50" y2="640" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.8"/>
  <line x1="1230" y1="0" x2="1230" y2="640" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.8"/>
  <line x1="0" y1="50" x2="1280" y2="50" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.8"/>
  <line x1="0" y1="590" x2="1280" y2="590" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.8"/>

  <!-- Main Comic Card Container -->
  <rect x="80" y="75" width="1120" height="490" rx="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" filter="url(#shadow)"/>

  <!-- Top Funny Header Badge -->
  <g transform="translate(640, 125)">
    <rect x="-240" y="-20" width="480" height="40" rx="20" fill="#FF4B4B" stroke="#1A1A1A" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      ⚠️ WARNING: HIGH CHANCE OF DRAWING A POTATO 🥔
    </text>
  </g>

  <!-- Left Side: Funny Graphic Comparison (Expectation vs Reality) -->
  <g transform="translate(130, 185)">
    <!-- Box 1: Expectation -->
    <rect x="0" y="0" width="230" height="230" rx="20" fill="#F0FDF4" stroke="#1A1A1A" stroke-width="3"/>
    <text x="115" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#166534" letter-spacing="0.5">
      EXPECTATION (100%)
    </text>
    <!-- Perfect Green Circle -->
    <circle cx="115" cy="125" r="60" fill="none" stroke="#22C55E" stroke-width="6" stroke-dasharray="none"/>
    <circle cx="115" cy="125" r="4" fill="#22C55E"/>
    <text x="115" y="210" text-anchor="middle" font-size="13" font-weight="800" fill="#15803D">
      ✨ Pure Math &amp; Elegance
    </text>

    <!-- VS Badge -->
    <circle cx="255" cy="115" r="22" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="255" y="122" text-anchor="middle" font-size="15" font-weight="900" fill="#FFE600">VS</text>

    <!-- Box 2: Reality (Wobbly Potato) -->
    <rect x="280" y="0" width="230" height="230" rx="20" fill="#FEF2F2" stroke="#1A1A1A" stroke-width="3"/>
    <text x="395" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#991B1B" letter-spacing="0.5">
      YOUR ATTEMPT (43.8%)
    </text>
    
    <!-- Funny Wobbly Potato Path -->
    <path d="M 395 70 C 450 65, 470 110, 455 150 C 445 180, 420 190, 385 185 C 345 180, 325 150, 335 110 C 345 75, 370 73, 395 70 Z" 
          fill="#FED7AA" stroke="#EA580C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sweat drop & wobble lines -->
    <path d="M 435 95 C 440 90, 445 100, 435 105 Z" fill="#38BDF8"/>
    <!-- Potato face -->
    <circle cx="375" cy="125" r="3" fill="#1A1A1A"/>
    <circle cx="415" cy="125" r="3" fill="#1A1A1A"/>
    <path d="M 385 145 Q 395 135 405 145" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="395" y="210" text-anchor="middle" font-size="13" font-weight="800" fill="#DC2626">
      🥔 Verdict: Lumpy Yam
    </text>
  </g>

  <!-- Right Side: The "Scientific" Meme Graph -->
  <g transform="translate(680, 185)">
    <rect x="0" y="0" width="470" height="230" rx="20" fill="#F8FAFC" stroke="#1A1A1A" stroke-width="3"/>
    
    <text x="235" y="30" text-anchor="middle" font-size="14" font-weight="900" fill="#1E293B" letter-spacing="0.5">
      📊 SCIENTIFIC ACCURACY DECAY GRAPH
    </text>

    <!-- Graph Axis -->
    <line x1="60" y1="180" x2="430" y2="180" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="50" x2="60" y2="180" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Axis Labels -->
    <text x="50" y="60" text-anchor="end" font-size="10" font-weight="800" fill="#64748B">100%</text>
    <text x="50" y="120" text-anchor="end" font-size="10" font-weight="800" fill="#64748B">50%</text>
    <text x="50" y="180" text-anchor="end" font-size="10" font-weight="800" fill="#64748B">0%</text>

    <text x="80" y="196" font-size="10" font-weight="800" fill="#64748B">Start Stroke</text>
    <text x="240" y="196" font-size="10" font-weight="800" fill="#64748B">Sneezing</text>
    <text x="380" y="196" font-size="10" font-weight="800" fill="#64748B">Panic</text>

    <!-- The Funny Plummeting Graph Curve -->
    <path d="M 60 70 Q 140 75 190 100 T 260 160 T 350 172 L 420 178" fill="none" stroke="#FF4B4B" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Funny annotations on graph -->
    <circle cx="60" cy="70" r="5" fill="#FF4B4B"/>
    <text x="75" y="65" font-size="10" font-weight="800" fill="#15803D">"I got this!" 🎯</text>

    <circle cx="260" cy="160" r="5" fill="#FF4B4B"/>
    <text x="270" y="150" font-size="10" font-weight="800" fill="#DC2626">"Wait no" 💀</text>

    <circle cx="420" cy="178" r="5" fill="#FF4B4B"/>
    <text x="400" y="165" text-anchor="end" font-size="10" font-weight="800" fill="#991B1B">"Pure Chaos" 😭</text>
  </g>

  <!-- Bottom Interactive Stats Strip -->
  <g transform="translate(640, 455)">
    <!-- Pill 1: Attempts -->
    <rect x="-480" y="-18" width="225" height="36" rx="12" fill="#FEF08A" stroke="#1A1A1A" stroke-width="2"/>
    <text x="-367" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#1A1A1A">🔁 Attempts: 4,892</text>

    <!-- Pill 2: Broken Circles -->
    <rect x="-240" y="-18" width="225" height="36" rx="12" fill="#FED7AA" stroke="#1A1A1A" stroke-width="2"/>
    <text x="-127" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#1A1A1A">🥚 Eggs Created: 4,891</text>

    <!-- Pill 3: Infinite Craft -->
    <rect x="0" y="-18" width="225" height="36" rx="12" fill="#E9D5FF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="112" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#1A1A1A">🧪 Infinite Craft: 100+ Combos</text>

    <!-- Pill 4: Perfectionists -->
    <rect x="240" y="-18" width="240" height="36" rx="12" fill="#BBF7D0" stroke="#1A1A1A" stroke-width="2"/>
    <text x="360" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#1A1A1A">👑 Perfectionists Crying: 99%</text>
  </g>

  <!-- Footer Developer Credit -->
  <g transform="translate(640, 525)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1A1A1A"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">
      BUILT BY SIDAKPREET &amp; EKAMDEEP (WE CAN'T DRAW CIRCLES EITHER)
    </text>
  </g>
</svg>
