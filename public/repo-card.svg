<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#FFF8F8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFD"/>
      <stop offset="100%" stop-color="#FFF0F0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F0D5D5" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- 40pt Safe Margin Guidelines (Template Style) -->
  <line x1="60" y1="0" x2="60" y2="640" stroke="#E63946" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="1220" y1="0" x2="1220" y2="640" stroke="#E63946" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#E63946" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="0" y1="580" x2="1280" y2="580" stroke="#E63946" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Inner Safe Card Container -->
  <rect x="90" y="90" width="1100" height="460" rx="32" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" filter="drop-shadow(10px 10px 0px #1A1A1A)"/>

  <!-- Brand Mark / Header Icon Badge -->
  <g transform="translate(640, 160)">
    <!-- GitHub Mark & Project Orb -->
    <circle cx="0" cy="0" r="42" fill="#1A1A1A"/>
    <!-- GitHub Inverted Octocat Silhouette -->
    <path fill="#FFFFFF" d="M0 -24 C-13.25 -24 -24 -13.25 -24 0 C-24 10.6 -17.12 19.6 -7.56 22.78 C-6.36 23 -6.8 22.26 -6.8 21.62 C-6.8 21.06 -6.82 19.56 -6.82 17.62 C-13.5 19.06 -14.9 14.4 -14.9 14.4 C-16 11.6 -17.6 10.86 -17.6 10.86 C-19.78 9.38 -17.44 9.4 -17.44 9.4 C-15.02 9.58 -13.76 11.88 -13.76 11.88 C-11.62 15.54 -8.14 14.48 -6.78 13.88 C-6.56 12.34 -5.94 11.28 -5.26 10.68 C-10.6 10.08 -16.2 8.02 -16.2 -1.16 C-16.2 -3.78 -15.26 -5.92 -13.74 -7.6 C-14 -8.2 -14.82 -10.64 -13.5 -13.94 C-13.5 -13.94 -11.48 -14.58 -6.9 -11.48 C-4.98 -12.02 -2.94 -12.28 -0.9 -12.3 C1.14 -12.28 3.18 -12.02 5.1 -11.48 C9.68 -14.58 11.7 -13.94 11.7 -13.94 C13.02 -10.64 12.2 -8.2 11.96 -7.6 C13.5 -5.92 14.42 -3.78 14.42 -1.16 C14.42 8.06 8.8 10.06 3.44 10.66 C4.24 11.34 4.96 12.72 4.96 14.82 C4.96 17.86 4.94 20.3 4.94 21.04 C4.94 21.68 4.5 22.44 5.72 22.2 C15.3 19.02 22.18 10.04 22.18 -0.56 C22.18 -13.82 11.42 -24.58 -1.82 -24.58 Z"/>
    
    <!-- Mini floating precision badges -->
    <circle cx="56" cy="-20" r="14" fill="#FF4B4B" stroke="#1A1A1A" stroke-width="2"/>
    <text x="56" y="-15" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">⭕</text>

    <circle cx="-56" cy="-20" r="14" fill="#2EC4B6" stroke="#1A1A1A" stroke-width="2"/>
    <text x="-56" y="-15" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">🧪</text>
  </g>

  <!-- Title: Draw a Perfect Circle -->
  <text x="640" y="275" text-anchor="middle" font-size="44" font-weight="900" fill="#1A1A1A" letter-spacing="-1.5">
    DRAW A PERFECT CIRCLE
  </text>

  <!-- Tagline / Description -->
  <text x="640" y="325" text-anchor="middle" font-size="22" font-weight="600" fill="#4B5563" letter-spacing="-0.3">
    7 Precision Micro-Challenges &amp; Infinite Craft Alchemy
  </text>

  <!-- Tags & Features Badges -->
  <g transform="translate(640, 390)">
    <!-- Badge 1: React 19 + TypeScript -->
    <rect x="-330" y="-18" width="150" height="36" rx="12" fill="#F3F4F6" stroke="#1A1A1A" stroke-width="2"/>
    <text x="-255" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#1A1A1A">⚛️ React 19 • TS</text>

    <!-- Badge 2: HTML5 Canvas -->
    <rect x="-165" y="-18" width="155" height="36" rx="12" fill="#F3F4F6" stroke="#1A1A1A" stroke-width="2"/>
    <text x="-87" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#1A1A1A">🎨 HTML5 Canvas</text>

    <!-- Badge 3: Web Audio FX -->
    <rect x="5" y="-18" width="155" height="36" rx="12" fill="#F3F4F6" stroke="#1A1A1A" stroke-width="2"/>
    <text x="82" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#1A1A1A">🔊 Web Audio Synth</text>

    <!-- Badge 4: Infinite Craft AI -->
    <rect x="175" y="-18" width="155" height="36" rx="12" fill="#F3F4F6" stroke="#1A1A1A" stroke-width="2"/>
    <text x="252" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#1A1A1A">✨ Infinite Craft</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="200" y1="455" x2="1080" y2="455" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Footer Developer Credit -->
  <g transform="translate(640, 495)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1A1A1A"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      DEVELOPED BY SIDAKPREET &amp; EKAMDEEP
    </text>
  </g>
</svg>
